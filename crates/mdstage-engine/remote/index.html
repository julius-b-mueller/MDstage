<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#21252b">
<title>MDstage Live</title>
<style>
  /* The colours of the MDstage live view. */
  :root {
    --background: #282c34; --panel: #21252b; --text: #abb2bf; --bright: #e6e6e6; --muted: #7f848e;
    --blue: #61afef; --green: #98c379; --yellow: #e5c07b; --red: #e06c75; --purple: #c678dd; --orange: #d19a66;
    --dim: #4b5263; --bar: #383c44; --info: #1c2028; --audio: #2c313a; --track: #383c44; --next: #1e2430;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--background); color: var(--text); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }

  header { background: var(--panel); padding: 8px 18px; display: flex; align-items: baseline; gap: 16px; flex: none; }
  #clock { font-size: 34px; color: var(--text); }
  #timecode { font-size: 22px; color: var(--muted); }
  #timecode.running { color: var(--yellow); }

  #info { background: var(--info); padding: 7px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; flex: none; }
  #info:empty { display: none; }
  .cell { display: flex; align-items: baseline; gap: 8px; padding-right: 12px; border-right: 1px solid var(--bar); white-space: nowrap; }
  .cell .dev { font-size: 11px; color: var(--dim); }
  .cell .val { font-size: 16px; font-weight: 600; color: var(--bright); max-width: 22em; overflow: hidden; text-overflow: ellipsis; }
  .miclabel { font-size: 11px; color: var(--dim); }
  .chip { font-size: 15px; padding: 1px 8px; border-radius: 9px; color: #1e2127; font-weight: 600; }
  .chip.leaving { background: none !important; border: 1px dashed currentColor; }

  #script { flex: 1; position: relative; overflow: hidden; min-height: 0; }
  #page { position: absolute; left: 0; right: 0; top: 0; padding: 0 28px; transition: transform 0.45s ease; will-change: transform; }
  .text { margin-bottom: 14px; line-height: 1.38; }
  .text.heading { background: var(--bar); margin-left: -28px; margin-right: -28px; padding: 5px 28px; }
  .group { display: flex; gap: 12px; margin-bottom: 14px; }
  .card { flex: 1; min-width: 0; position: relative; background: var(--panel); border-radius: 6px; padding: 14px 16px 14px 18px; font-size: 16px; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 2px; background: var(--blue); }
  .card.fired::before { background: var(--dim); }
  .card.current::before { background: var(--yellow); }
  /* The next cue: a white frame (no glow), larger type. */
  .card.next { background: var(--next); border-radius: 8px; outline: 1.5px solid rgba(255, 255, 255, 0.85); outline-offset: -1.5px; font-size: 21px; }
  .card.next::before { display: none; }
  .card.dimmed { opacity: 0.35; }
  .card.choose { animation: choose 1s ease-in-out infinite; cursor: pointer; }
  @keyframes choose { 50% { opacity: 0.72; } }
  .title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 9px; }
  .title .name { font-size: 1.125em; color: var(--bright); }
  .title .now { font-size: 0.8em; color: var(--yellow); }
  .title .sound { color: var(--green); }
  .row { display: flex; gap: 0; line-height: 1.45; }
  .row .label { flex: none; width: 3.6em; font-size: 0.875em; color: var(--muted); padding-top: 0.1em; }
  .row .spans { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .row .spans span + span { margin-left: 0.35em; }
  .wait { position: absolute; left: 18px; right: 16px; bottom: 5px; height: 4px; border-radius: 2px; background: var(--audio); overflow: hidden; }
  .wait div { height: 100%; }

  #audio { background: var(--audio); padding: 9px 18px; flex: none; }
  #audio:empty { display: none; }
  .play { display: flex; align-items: center; gap: 10px; height: 26px; }
  .play .what { width: 30%; min-width: 120px; max-width: 300px; display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; }
  .play .what span:last-child { overflow: hidden; text-overflow: ellipsis; font-size: 16px; }
  .loop { font-size: 12px; color: var(--purple); border: 1px solid rgba(198, 120, 221, 0.4); border-radius: 3px; padding: 0 4px; flex: none; }
  .play .bar { flex: 1; height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
  .play .bar div { height: 100%; border-radius: 5px; }
  .play .time { min-width: 120px; text-align: right; font-size: 14px; color: var(--muted); white-space: nowrap; }

  #progress { background: #272b32; padding: 8px 14px; flex: none; }
  #progress .where { font-size: 14px; display: flex; gap: 10px; margin-bottom: 4px; }
  #progress .where span:last-child { color: var(--muted); }
  #segments { display: flex; gap: 3px; height: 5px; }
  #segments div { height: 5px; border-radius: 2.5px; background: var(--track); min-width: 3px; overflow: hidden; }
  #segments div div { background: rgba(255, 255, 255, 0.5); }

  footer { background: var(--panel); padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 14px; flex: none; }
  footer button { height: 58px; border: none; border-radius: 8px; background: var(--track); color: var(--text); font-size: 21px; font-weight: 700; font-family: inherit; cursor: pointer; }
  footer button:disabled { color: var(--muted); cursor: default; }
  #back { width: 180px; }
  #up, #down { width: 58px; font-size: 18px; font-weight: 400; }
  #go { flex: 1; }
  #go.ready { background: var(--green); color: #1e2127; }
  #note { background: var(--info); color: var(--yellow); font-size: 14px; padding: 6px 18px; flex: none; }
  #note:empty { display: none; }

  #lock { position: fixed; inset: 0; background: var(--background); display: none; align-items: center; justify-content: center; }
  #lock.shown { display: flex; }
  #lock form { display: flex; flex-direction: column; gap: 12px; width: min(20rem, 86vw); }
  #lock label { color: var(--bright); font-size: 18px; }
  #lock input { font-size: 28px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--bar); background: var(--panel); color: var(--bright); letter-spacing: 0.2em; }
  #lock button { height: 52px; border: none; border-radius: 8px; background: var(--green); color: #1e2127; font-size: 19px; font-weight: 700; }
  #lock .problem { color: var(--red); min-height: 1.2em; }

  @media (max-width: 640px) {
    #page { padding: 0 12px; }
    #back { width: 96px; }
    footer { gap: 8px; padding-left: 10px; padding-right: 10px; }
    .play .time { min-width: 0; }
  }
</style>
</head>
<body>
<header><span id="clock" class="mono">--:--:--</span><span id="timecode" class="mono">--:--:--:--</span></header>
<div id="info"></div>
<div id="script"><div id="page"></div></div>
<div id="audio"></div>
<div id="progress"><div class="where"><span id="act"></span><span id="scene"></span></div><div id="segments"></div></div>
<div id="note"></div>
<footer>
  <button id="back" type="button">Back</button>
  <button id="up" type="button">▲</button>
  <button id="down" type="button">▼</button>
  <button id="go" type="button">Go</button>
</footer>
<div id="lock"><form><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password"><div class="problem"></div><button type="submit">OK</button></form></div>
<script src="/__remote/app.js"></script>
</body>
</html>
