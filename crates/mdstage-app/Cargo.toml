[package]
name = "mdstage-app"
description = "MDstage desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "mdstage"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
rfd = "0.15"
sha2 = "0.10"
docx-rs = "0.4"
typst = "0.13"
typst-pdf = "0.13"
typst-assets = { version = "0.13", features = ["fonts"] }
mdstage-core = { path = "../mdstage-core" }
mdstage-engine = { path = "../mdstage-engine" }
