[package]
name = "mdstage-app"
description = "MDstage desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "mdstage"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
rfd = "0.15"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
docx-rs = "0.4"
typst = "0.13"
typst-pdf = "0.13"
typst-assets = { version = "0.13", features = ["fonts"] }
mdstage-core = { path = "../mdstage-core" }
mdstage-engine = { path = "../mdstage-engine" }

[package.metadata.deb]
name = "mdstage"
maintainer = "Julius B. Müller <hello@mdstage.org>"
extended-description = "Stage manager app for live shows and theatre: the script is a Markdown file with cues embedded as YAML; audio playback, MIDI, timecode, OSC and a live view from a single file."
section = "sound"
assets = [
    ["target/release/mdstage", "usr/bin/mdstage", "755"],
    ["../../dist/assets/icon.png", "usr/share/icons/hicolor/512x512/apps/mdstage.png", "644"],
    ["mdstage.desktop", "usr/share/applications/mdstage.desktop", "644"],
]
