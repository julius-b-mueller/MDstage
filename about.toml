# cargo-about: which licenses a dependency may have, and for which platforms the
# notices in THIRD-PARTY-LICENSES.txt are collected (scripts/third-party-licenses.sh).
# A crate under any other license (GPL, for one) makes the CI job `audit` fail.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Only for the files of these crates (symphonia, resvg, usvg); MDstage stays MIT.
    "MPL-2.0",
]

targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

# Only what ends up in the program.
ignore-build-dependencies = true
ignore-dev-dependencies = true

workarounds = ["ring", "rustls"]
