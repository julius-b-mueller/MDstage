<!DOCTYPE html>
<html>
<head>
    <title>Einstellungen – Vorschau</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../app/styles.css">
    <script>window.__webPreview = true</script>
    <script src="shim.js"></script>
    <script src="../app/i18n.js"></script>
</head>
<body>
<script type="module">
    const html = await fetch('../app/settings.html').then(r => r.text())
    const doc  = new DOMParser().parseFromString(html, 'text/html')

    // Inject inline styles from settings.html
    for (const el of doc.head.querySelectorAll('style'))
        document.head.appendChild(document.adoptNode(el))

    // Inject body content without script tags
    for (const s of doc.body.querySelectorAll('script')) s.remove()
    document.body.innerHTML = doc.body.innerHTML

    // Load settings.js after DOM is in place
    await new Promise((resolve, reject) => {
        const s = document.createElement('script')
        s.src = '../app/settings.js'
        s.onload = resolve
        s.onerror = reject
        document.body.appendChild(s)
    })
</script>
</body>
</html>
