<!DOCTYPE html>
<html>
<head>
    <title>Main Desk – Vorschau</title>
    <link rel="stylesheet" href="../app/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <!-- Set preview flag and load shim before bundle.js so MIDI override is in place -->
    <script>window.__webPreview = true</script>
    <script src="shim.js"></script>
    <style>
        #preview-notice {
            background: #2a221a;
            border-bottom: 1px solid #e5c07b44;
            border-left: 4px solid #e5c07b;
            padding: 0.5rem 1rem;
            font-size: 0.78rem;
            color: #abb2bf;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 25;
        }
        #preview-notice strong { color: #e5c07b; }
        .preview-lang-toggle { display:flex; gap:2px; margin-left:auto; flex-shrink:0; }
        .plang-btn {
            background: none; border: 1px solid #5c637055; color: #5c6370;
            cursor: pointer; padding: 2px 8px; border-radius: 4px;
            font-size: 0.72rem; font-weight: 700; font-family: inherit;
            transition: all 0.15s;
        }
        .plang-btn.active { background: #383c44; color: #fff; border-color: #5c6370; }
        .plang-btn:hover:not(.active) { color: #abb2bf; border-color: #5c6370; }

        /* Banner-Höhe ≈ 36px (padding 2×0.5rem + Zeilenhöhe) */

        /* Inhalt unter das Banner schieben */
        body           { padding-top: 36px; }
        /* Buttons und Menü-Button unter das Banner */
        .buttons                { top: calc(0.5rem + 36px) !important; }
        .sidebar-toggle-button  { top: calc(0.5rem + 36px) !important; }
        /* Sticky-Headings unter dem Banner einrasten;
           z-index über #header-shield (11), damit sie nicht dahinter verschwinden */
        h1, h2         { top: 36px !important; z-index: 15 !important; }
        /* Shield nicht nötig — Headings haben eigenen Hintergrund */
        #header-shield { display: none !important; }

        /* ── Onboarding-Spotlight ─────────────────────────────────────── */
        .live-onboard-overlay {
            position: fixed;
            inset: 0;
            z-index: 400;
            pointer-events: all;
            cursor: default;
            transition: opacity 0.35s ease;
        }
        .live-onboard-overlay.hiding { opacity: 0; pointer-events: none; }
        .live-onboard-label {
            position: fixed;
            z-index: 401;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            letter-spacing: 0.03em;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,1), 0 0 28px rgba(0,0,0,0.9);
            white-space: nowrap;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            transition: opacity 0.18s ease;
        }
        .live-onboard-label.hiding { opacity: 0; }
        .live-onboard-bar {
            position: fixed;
            bottom: 1.6rem;
            right: 1.8rem;
            z-index: 401;
            display: flex;
            align-items: center;
            gap: 1rem;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .live-onboard-bar.hiding { opacity: 0; }
        .live-onboard-dots { display: flex; gap: 0.45rem; align-items: center; }
        .live-onboard-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.28);
            transition: background 0.2s;
        }
        .live-onboard-dot.active { background: #fff; }
        .live-onboard-btn {
            pointer-events: all;
            background: #61afef;
            color: #1a1e27;
            border: none;
            border-radius: 7px;
            padding: 0.52rem 1.2rem;
            font-size: 0.92rem;
            font-weight: 700;
            font-family: inherit;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background 0.15s;
        }
        .live-onboard-btn:hover { background: #76c0f5; }

        /* LIVE-Button */
        .live-window-button {
            width: auto !important;
            padding: 0 0.65rem !important;
            font-size: 0.78rem !important;
            font-weight: 700 !important;
            letter-spacing: 0.06em !important;
            gap: 0.25rem !important;
            background: #1e3a52 !important;
            border: 1px solid #61afef55 !important;
            color: #61afef !important;
            white-space: nowrap !important;
        }
        .live-window-button:hover { background: #243e5a !important; border-color: #61afef !important; }
        .live-btn-arrow {
            display: inline-block;
            animation: live-arrow-pulse 1.3s ease-in-out infinite;
        }
        @keyframes live-arrow-pulse {
            0%, 100% { opacity: 1;   transform: translate(0, 0); }
            50%       { opacity: 0.2; transform: translate(2px, -2px); }
        }
    </style>
</head>
<body>
    <div id="preview-notice">
        <strong>⚠ Vorschau-Modus</strong>
        MIDI und OSC sind nicht verfügbar. Änderungen am Skript werden nicht gespeichert.
        <div class="preview-lang-toggle">
            <button class="plang-btn" data-lang="de" onclick="window.__previewSetLanguage('de')">DE</button>
            <button class="plang-btn" data-lang="en" onclick="window.__previewSetLanguage('en')">EN</button>
        </div>
    </div>
    <script>
        // Aktiven Button nach dem Laden setzen
        ;(function() {
            const l = (typeof sessionStorage !== 'undefined' && sessionStorage.getItem('preview-lang')) || 'de'
            document.querySelectorAll('.plang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l))
        })()
    </script>

    <div id="scene-sidebar">
        <div class="scene-sidebar-header" data-i18n="sidebar.title">Szenen</div>
        <div id="scene-list"></div>
    </div>

    <div id="search-bar" class="hidden">
        <input id="search-input" type="text" data-i18n-ph="search.ph" placeholder="Suchen…" autocomplete="off" spellcheck="false">
        <span id="search-count"></span>
        <button id="search-prev" data-i18n-title="search.prev.title" title="Vorheriges (Shift+Enter)">↑</button>
        <button id="search-next" data-i18n-title="search.next.title" title="Nächstes (Enter)">↓</button>
        <button id="search-close" data-i18n-title="search.close.title" title="Schließen (Esc)">×</button>
    </div>

    <div id="header-shield"></div>
    <div id="script-content"></div>
    <div class="sidebar-toggle-button button" style="font-size:1.4rem" data-i18n-title="toolbar.sidebar.title" title="Szenenübersicht (Strg+B)">☰</div>

    <div class="buttons">
        <div class="clock">00:00:00</div>
        <div class="tc-display">--:--:--:--</div>
        <div class="button live-window-button" title="Live-Ansicht in separatem Fenster öffnen">
            LIVE <span class="live-btn-arrow">↗</span>
        </div>
        <div class="button reload-button" style="font-size:1.4rem">↺</div>
        <div class="button current-trigger-button" style="font-size:1.4rem">⌖</div>
        <div class="button emergency em-light"><img src="../app/assets/em-light.svg" alt=""></div>
        <div class="button emergency em-mic"><img src="../app/assets/em-mic.svg" alt=""></div>
        <div class="button emergency em-music"><img src="../app/assets/em-music.svg" alt=""></div>
    </div>
    <script src="../app/i18n.js"></script>
    <script src="../app/bundle.js"></script>
    <script>
    ;(function () {
        function whenReady(cb) {
            if (document.querySelector('.insert-btn')) { cb(); return }
            const obs = new MutationObserver(() => {
                if (document.querySelector('.insert-btn')) { obs.disconnect(); cb() }
            })
            obs.observe(document.body, { childList: true, subtree: true })
        }

        // Pick the element whose top edge is closest to targetFrac of viewport height,
        // among elements that are currently visible in the viewport.
        function pickByDepth(els, targetFrac) {
            const targetY = window.innerHeight * targetFrac
            const visible = els.filter(el => {
                const t = el.getBoundingClientRect().top
                return t >= 60 && t < window.innerHeight - 40
            })
            const pool = visible.length ? visible : els
            return pool.reduce((best, el) => {
                const d  = Math.abs(el.getBoundingClientRect().top - targetY)
                const db = Math.abs(best.getBoundingClientRect().top - targetY)
                return d < db ? el : best
            })
        }

        function buildSteps() {
            const liveBtn    = document.querySelector('.live-window-button')
            const insertBtns = [...document.querySelectorAll('.insert-btn')].slice(1) // skip very first
            const textBlocks = [...document.querySelectorAll('[data-block-idx]')]
                .filter(el => !el.querySelector('.trigger'))
            if (!liveBtn || !insertBtns.length || !textBlocks.length) return null

            const insertBtn = pickByDepth(insertBtns, 0.45)
            const textBlock = pickByDepth(textBlocks, 0.55)

            return [
                {
                    el: liveBtn,
                    lines: ['Liveansicht öffnen'],
                    enter: null, leave: null,
                },
                {
                    el: insertBtn,
                    lines: ['Click auf +: Cue erstellen', 'SHIFT+CLICK auf +: Dialog erstellen'],
                    enter: () => { insertBtn.style.opacity = '1' },
                    leave: () => { insertBtn.style.opacity = '' },
                },
                {
                    el: textBlock,
                    lines: ['SHIFT+CLICK auf Text: Text bearbeiten'],
                    circle: (rect) => ({
                        cx: Math.round(rect.left + 55),
                        cy: Math.round(rect.top  + rect.height / 2),
                        R:  58,
                    }),
                    enter: null, leave: null,
                },
            ]
        }

        // Place label to the right of the circle when element is on the left half,
        // to the left when on the right half. Clamp to viewport.
        function positionLabel(label, cx, cy, R) {
            const W  = window.innerWidth
            const H  = window.innerHeight
            const LW = label.offsetWidth  || 300
            const LH = label.offsetHeight || 55
            const gap = 18

            label.style.left = ''
            label.style.right = ''
            label.style.transform = ''

            let left
            if (cx < W * 0.5) {
                left = Math.min(cx + R + gap, W - LW - 8)
            } else {
                left = Math.max(8, cx - R - gap - LW)
            }
            // Vertically center on element, keep away from bottom bar
            const top = Math.max(8, Math.min(cy - LH / 2, H - LH - 90))

            label.style.left = left + 'px'
            label.style.top  = top  + 'px'
        }

        function showOnboard() {
            const steps = buildSteps()
            if (!steps) return

            const overlay = document.createElement('div')
            overlay.className = 'live-onboard-overlay'

            const label = document.createElement('div')
            label.className = 'live-onboard-label'

            const bar = document.createElement('div')
            bar.className = 'live-onboard-bar'
            const dots = document.createElement('div')
            dots.className = 'live-onboard-dots'
            const btn = document.createElement('button')
            btn.className = 'live-onboard-btn'
            bar.append(dots, btn)

            document.body.append(overlay, label, bar)

            // ── Spotlight animation ───────────────────────────────────────
            let sCx = null, sCy = null, sR = null, animRaf = null

            function applySpotlight(cx, cy, R) {
                overlay.style.background =
                    `radial-gradient(circle ${R}px at ${cx}px ${cy}px, ` +
                    `transparent 0%, transparent ${R - 4}px, rgba(0,0,0,0.82) ${R + 6}px)`
            }

            function animateTo(cx, cy, R) {
                if (sCx === null) { sCx = cx; sCy = cy; sR = R; applySpotlight(cx, cy, R); return }
                if (animRaf) cancelAnimationFrame(animRaf)
                const fromCx = sCx, fromCy = sCy, fromR = sR
                const dur = 480, t0 = performance.now()
                function tick(now) {
                    const p = Math.min(1, (now - t0) / dur)
                    const e = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2  // easeInOutQuad
                    sCx = fromCx + (cx - fromCx) * e
                    sCy = fromCy + (cy - fromCy) * e
                    sR  = fromR  + (R  - fromR)  * e
                    applySpotlight(sCx, sCy, sR)
                    if (p < 1) animRaf = requestAnimationFrame(tick)
                    else { sCx = cx; sCy = cy; sR = R }
                }
                animRaf = requestAnimationFrame(tick)
            }
            // ─────────────────────────────────────────────────────────────

            let currentStep = 0

            function goTo(i) {
                if (steps[currentStep]?.leave) steps[currentStep].leave()
                currentStep = i

                const { el, lines, enter, circle } = steps[i]
                if (enter) enter()

                const rect = el.getBoundingClientRect()
                const defaultCx = Math.round(rect.left + rect.width  / 2)
                const defaultCy = Math.round(rect.top  + rect.height / 2)
                const defaultR  = Math.max(46, Math.round(Math.min(Math.max(rect.width, rect.height) * 0.85 + 10, 66)))
                const { cx = defaultCx, cy = defaultCy, R = defaultR } = circle ? circle(rect) : {}

                animateTo(cx, cy, R)

                label.innerHTML = lines.map(l => `<span>${l}</span>`).join('')
                label.style.opacity = '0'
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    positionLabel(label, cx, cy, R)
                    label.style.opacity = '1'
                }))

                dots.innerHTML = steps.map((_, j) =>
                    `<span class="live-onboard-dot${j === i ? ' active' : ''}"></span>`
                ).join('')
                btn.textContent = i < steps.length - 1 ? 'Weiter →' : 'Verstanden'
            }

            btn.addEventListener('click', () => {
                if (currentStep < steps.length - 1) {
                    goTo(currentStep + 1)
                } else {
                    if (steps[currentStep]?.leave) steps[currentStep].leave()
                    label.classList.add('hiding')
                    bar.classList.add('hiding')
                    // Expand the spotlight circle until it fills the screen, then remove
                    if (animRaf) cancelAnimationFrame(animRaf)
                    const maxR = Math.ceil(Math.hypot(window.innerWidth, window.innerHeight))
                    const fromR = sR, cx = sCx, cy = sCy
                    const dur = 460, t0 = performance.now()
                    ;(function tick(now) {
                        const p = Math.min(1, (now - t0) / dur)
                        const e = 1 - Math.pow(1 - p, 3)  // easeOutCubic: fast start, smooth finish
                        applySpotlight(cx, cy, fromR + (maxR - fromR) * e)
                        if (p < 1) animRaf = requestAnimationFrame(tick)
                        else { overlay.remove(); label.remove(); bar.remove() }
                    })(t0)
                }
            })

            goTo(0)
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => whenReady(showOnboard))
        } else {
            whenReady(showOnboard)
        }
    })()
    </script>
</body>
</html>
