<!DOCTYPE html>
<html>
<head>
    <title>Main Desk – Vorschau</title>
    <link rel="stylesheet" href="../app/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <!-- Set preview flag and load shim before bundle.js so MIDI override is in place -->
    <script>window.__webPreview = true</script>
    <script src="shim.js"></script>
    <style>
        #preview-notice {
            background: #2a221a;
            border-bottom: 1px solid #e5c07b44;
            border-left: 4px solid #e5c07b;
            padding: 0.5rem 1rem;
            font-size: 0.78rem;
            color: #abb2bf;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 25;
        }
        #preview-notice strong { color: #e5c07b; }
        .preview-lang-toggle { display:flex; gap:2px; margin-left:auto; flex-shrink:0; }
        .plang-btn {
            background: none; border: 1px solid #5c637055; color: #5c6370;
            cursor: pointer; padding: 2px 8px; border-radius: 4px;
            font-size: 0.72rem; font-weight: 700; font-family: inherit;
            transition: all 0.15s;
        }
        .plang-btn.active { background: #383c44; color: #fff; border-color: #5c6370; }
        .plang-btn:hover:not(.active) { color: #abb2bf; border-color: #5c6370; }

        /* Banner-Höhe ≈ 36px (padding 2×0.5rem + Zeilenhöhe) */

        /* Inhalt unter das Banner schieben */
        body           { padding-top: 36px; }
        /* Buttons und Menü-Button unter das Banner */
        .buttons                { top: calc(0.5rem + 36px) !important; }
        .sidebar-toggle-button  { top: calc(0.5rem + 36px) !important; }
        /* Sticky-Headings unter dem Banner einrasten;
           z-index über #header-shield (11), damit sie nicht dahinter verschwinden */
        h1, h2         { top: 36px !important; z-index: 15 !important; }
        /* Shield nicht nötig — Headings haben eigenen Hintergrund */
        #header-shield { display: none !important; }

        /* LIVE-Button */
        .live-window-button {
            width: auto !important;
            padding: 0 0.65rem !important;
            font-size: 0.78rem !important;
            font-weight: 700 !important;
            letter-spacing: 0.06em !important;
            gap: 0.25rem !important;
            background: #1e3a52 !important;
            border: 1px solid #61afef55 !important;
            color: #61afef !important;
            white-space: nowrap !important;
        }
        .live-window-button:hover { background: #243e5a !important; border-color: #61afef !important; }
        .live-btn-arrow {
            display: inline-block;
            animation: live-arrow-pulse 1.3s ease-in-out infinite;
        }
        @keyframes live-arrow-pulse {
            0%, 100% { opacity: 1;   transform: translate(0, 0); }
            50%       { opacity: 0.2; transform: translate(2px, -2px); }
        }
    </style>
</head>
<body>
    <div id="preview-notice">
        <strong>⚠ Vorschau-Modus</strong>
        MIDI und OSC sind nicht verfügbar. Änderungen am Skript werden nicht gespeichert.
        <div class="preview-lang-toggle">
            <button class="plang-btn" data-lang="de" onclick="window.__previewSetLanguage('de')">DE</button>
            <button class="plang-btn" data-lang="en" onclick="window.__previewSetLanguage('en')">EN</button>
        </div>
    </div>
    <script>
        // Aktiven Button nach dem Laden setzen
        ;(function() {
            const l = (typeof sessionStorage !== 'undefined' && sessionStorage.getItem('preview-lang')) || 'de'
            document.querySelectorAll('.plang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l))
        })()
    </script>

    <div id="scene-sidebar">
        <div class="scene-sidebar-header" data-i18n="sidebar.title">Szenen</div>
        <div id="scene-list"></div>
    </div>

    <div id="search-bar" class="hidden">
        <input id="search-input" type="text" data-i18n-ph="search.ph" placeholder="Suchen…" autocomplete="off" spellcheck="false">
        <span id="search-count"></span>
        <button id="search-prev" data-i18n-title="search.prev.title" title="Vorheriges (Shift+Enter)">↑</button>
        <button id="search-next" data-i18n-title="search.next.title" title="Nächstes (Enter)">↓</button>
        <button id="search-close" data-i18n-title="search.close.title" title="Schließen (Esc)">×</button>
    </div>

    <div id="header-shield"></div>
    <div id="script-content"></div>
    <div class="sidebar-toggle-button button" style="font-size:1.4rem" data-i18n-title="toolbar.sidebar.title" title="Szenenübersicht (Strg+B)">☰</div>

    <div class="buttons">
        <div class="clock">00:00:00</div>
        <div class="tc-display">--:--:--:--</div>
        <div class="button live-window-button" title="Live-Ansicht in separatem Fenster öffnen">
            LIVE <span class="live-btn-arrow">↗</span>
        </div>
        <div class="button reload-button" style="font-size:1.4rem">↺</div>
        <div class="button current-trigger-button" style="font-size:1.4rem">⌖</div>
        <div class="button emergency em-light"><img src="../app/assets/em-light.svg" alt=""></div>
        <div class="button emergency em-mic"><img src="../app/assets/em-mic.svg" alt=""></div>
        <div class="button emergency em-music"><img src="../app/assets/em-music.svg" alt=""></div>
    </div>
    <script src="../app/i18n.js"></script>
    <script src="../app/bundle.js"></script>
</body>
</html>
