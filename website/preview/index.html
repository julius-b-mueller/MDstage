<!DOCTYPE html>
<html lang="de">
<head>
    <title>Main Desk – Interaktive Vorschau</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; background: #1e2127; overflow: hidden; }

        .preview-wrap {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .preview-panels {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 2px;
            background: #383c44;
        }

        .panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            background: #282c34;
        }
        .panel-main { flex: 3; }
        .panel-live { flex: 1; min-width: 320px; max-width: 460px; }

        .panel-label {
            background: #21252b;
            color: #5c6370;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            padding: 0.28rem 0.9rem;
            border-bottom: 1px solid #2c313a;
            flex-shrink: 0;
        }

        iframe {
            flex: 1;
            border: none;
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="preview-wrap">
        <div class="preview-panels">
            <div class="panel panel-main">
                <div class="panel-label">Hauptansicht</div>
                <iframe id="main-frame" src="preview-main.html" title="Main Desk Hauptansicht"></iframe>
            </div>
            <div class="panel panel-live">
                <div class="panel-label">Live-Ansicht</div>
                <iframe id="live-frame" src="preview-live.html" title="Main Desk Live-Ansicht"></iframe>
            </div>
        </div>
    </div>

    <script>
        const mainFrame = document.getElementById('main-frame')
        const liveFrame = document.getElementById('live-frame')

        window.addEventListener('message', (e) => {
            if (!e.data?.type) return
            const { type } = e.data

            // Main iframe → Live iframe (state broadcasts)
            if (type === 'live-state' || type === 'live-volumes') {
                liveFrame.contentWindow.postMessage(e.data, '*')
                return
            }
            // Live iframe → Main iframe (Go/Back/variant commands)
            if (type === 'live-go' || type === 'live-back' ||
                type === 'select-variant' || type === 'stop-audio') {
                mainFrame.contentWindow.postMessage(e.data, '*')
                return
            }
        })
    </script>
</body>
</html>
