<!DOCTYPE html>
<html lang="de">
<head>
    <title>Main Desk – Interaktive Vorschau</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; background: #1e2127; overflow: hidden; }

        .preview-wrap {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .preview-panels {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 2px;
            background: #383c44;
        }

        .panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            background: #282c34;
        }
        .panel-main { flex: 1; }

        .panel-label {
            background: #21252b;
            color: #5c6370;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            padding: 0.28rem 0.9rem;
            border-bottom: 1px solid #2c313a;
            flex-shrink: 0;
        }

        iframe {
            flex: 1;
            border: none;
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="preview-wrap">
        <div class="preview-panels">
            <div class="panel panel-main">
                <iframe id="main-frame" src="preview-main.html" title="Main Desk Vorschau"></iframe>
            </div>
        </div>
    </div>

    <!-- Kein Routing nötig — Kommunikation läuft via BroadcastChannel direkt
         zwischen den Frames (und ggf. separaten Fenstern). -->
</body>
</html>
