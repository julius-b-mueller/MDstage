<!DOCTYPE html>
<html>
<head>
    <title>Live-Ansicht</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ── Layout ─────────────────────────────────────────────────────── */
        html, body { height: 100%; overflow: hidden; }
        body { display: flex; flex-direction: column; background-color: #282c34; }

        /* ── Header ─────────────────────────────────────────────────────── */
        .live-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 0.5rem 1.2rem;
            background: #21252b;
            border-bottom: 1px solid #383c44;
            flex-shrink: 0;
            z-index: 20;
        }
        .live-clock {
            font-size: 1.8rem;
            font-variant-numeric: tabular-nums;
            color: #abb2bf;
            font-weight: 300;
            background: transparent;
            box-shadow: none;
            width: auto; padding: 0; margin: 0; line-height: 1;
        }
        .live-tc {
            font-size: 0.85rem;
            font-variant-numeric: tabular-nums;
            color: #5c6370;
            font-family: 'SF Mono', 'Fira Code', monospace;
            min-width: 8rem;
        }
        .live-tc.tc-active { color: #e5c07b; }

        /* ── Script area ─────────────────────────────────────────────────── */
        .script-area { flex: 1; position: relative; min-height: 0; }
        .script-scroll {
            height: 100%;
            overflow-y: auto;
            padding: 2rem 0 2rem;
            scroll-behavior: smooth;
        }
        .script-scroll::-webkit-scrollbar { width: 5px; }
        .script-scroll::-webkit-scrollbar-thumb { background: #383c44; border-radius: 3px; }

        /* Fade mask */
        .script-area::before, .script-area::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 5rem;
            pointer-events: none;
            z-index: 5;
        }
        .script-area::before { top: 0;    background: linear-gradient(to bottom, #282c34 10%, transparent); }
        .script-area::after  { bottom: 0; background: linear-gradient(to top,   #282c34 10%, transparent); }

        /* ── Block wrappers ──────────────────────────────────────────────── */
        .live-text h1, .live-text h2, .live-text h3 {
            position: static !important;
            box-shadow: none !important;
            margin-top: 0;
        }
        .live-text p { margin: 0.4rem 1rem; }
        .live-block-past { opacity: 0.3; }
        .live-block-current .trigger { border-left-color: #e5c07b55; }
        .live-block-next .trigger {
            border-left: 5px solid #61afef !important;
            background-color: #1d2736 !important;
            box-shadow: 0 0 18px #61afef22, black 0 0 10px;
        }
        .trigger .trigger-actions  { display: none; }
        .trigger .trigger-move-btns { display: none; }
        .trigger { cursor: default !important; }
        .trigger:active { box-shadow: black 0 0 10px !important; background-color: inherit !important; }
        .live-next-label {
            font-size: 0.75rem;
            color: #61afef;
            padding: 0.15rem 0.5rem 0.4rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        #next-anchor { scroll-margin-top: 30vh; scroll-margin-bottom: 30vh; }

        /* ── Audio progress ──────────────────────────────────────────────── */
        .audio-panel {
            flex-shrink: 0;
            background: #21252b;
            border-top: 1px solid #383c44;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Each row animates in/out via max-height + opacity */
        .audio-row {
            display: grid;
            grid-template-columns: minmax(0, 11rem) 1fr auto auto;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.82rem;
            overflow: hidden;
            max-height: 2.4rem;
            opacity: 1;
            padding: 0.35rem 0;
            /* transition only affects enter/leave; rAF handles bar width */
            transition: max-height 0.28s ease, opacity 0.28s ease, padding 0.28s ease;
        }
        .audio-row.entering, .audio-row.leaving {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
        }
        .audio-label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #abb2bf;
        }
        .audio-loop-badge {
            font-size: 0.72rem;
            color: #c678dd;
            border: 1px solid #c678dd55;
            border-radius: 3px;
            padding: 0 0.3rem;
            margin-left: 0.3rem;
            flex-shrink: 0;
        }
        .audio-bar-wrap {
            height: 6px;
            background: #383c44;
            border-radius: 3px;
            overflow: hidden;
        }
        .audio-bar-fill {
            height: 100%;
            background: #98c379;
            border-radius: 3px;
            will-change: width;
        }
        .audio-loop-fill { background: #c678dd; }
        .audio-time {
            font-variant-numeric: tabular-nums;
            color: #5c6370;
            font-size: 0.78rem;
            white-space: nowrap;
            text-align: right;
        }

        /* ── Bottom bar ──────────────────────────────────────────────────── */
        .bottom-bar {
            display: flex;
            gap: 1rem;
            padding: 0.75rem 1.2rem;
            background: #21252b;
            border-top: 1px solid #383c44;
            flex-shrink: 0;
        }
        .ctrl-btn {
            flex: 1;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: 600;
            padding: 0.7rem 1rem;
            transition: background 0.1s, transform 0.05s;
            user-select: none;
            letter-spacing: 0.02em;
        }
        .ctrl-btn:active { transform: scale(0.97); }
        .btn-back { background: #383c44; color: #abb2bf; max-width: 10rem; }
        .btn-back:hover { background: #4b5263; }
        .btn-go   { background: #98c379; color: #1e2127; }
        .btn-go:hover { background: #a8d389; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.35; }
        }
    </style>
</head>
<body>
    <div class="live-header">
        <span class="live-clock" id="live-clock">00:00:00</span>
        <span class="live-tc" id="live-tc"></span>
    </div>

    <div class="script-area">
        <div class="script-scroll" id="script-scroll">
            <div id="script-blocks"></div>
        </div>
    </div>

    <div class="audio-panel" id="audio-panel"></div>

    <div class="bottom-bar">
        <button class="ctrl-btn btn-back" id="btn-back">◀ Back</button>
        <button class="ctrl-btn btn-go"   id="btn-go">Go ▶</button>
    </div>

    <script>
        const clockEl    = document.getElementById('live-clock')
        const tcEl       = document.getElementById('live-tc')
        const blocksEl   = document.getElementById('script-blocks')
        const scrollEl   = document.getElementById('script-scroll')
        const audioPanEl = document.getElementById('audio-panel')
        const btnGo      = document.getElementById('btn-go')
        const btnBack    = document.getElementById('btn-back')

        const MIC_SVG  = `<svg class="t-icon" viewBox="0 0 12 18" width="10" height="15" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><rect x="3" y="0.5" width="6" height="9" rx="3"/><line x1="3.5" y1="3.5" x2="8.5" y2="3.5" stroke-width="0.55"/><line x1="3.5" y1="6" x2="8.5" y2="6" stroke-width="0.55"/><path d="M1 8 Q6 13.5 11 8"/><line x1="6" y1="11.5" x2="6" y2="15"/><line x1="3" y1="15" x2="9" y2="15"/></svg>`
        const TAPE_SVG = `<svg class="t-icon" viewBox="0 0 22 12" width="22" height="12" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><circle cx="5" cy="6" r="4"/><circle cx="5" cy="6" r="1.3"/><line x1="5" y1="2" x2="5" y2="4.7"/><line x1="1.5" y1="8" x2="3.9" y2="6.7"/><line x1="8.5" y1="8" x2="6.1" y2="6.7"/><circle cx="17" cy="6" r="4"/><circle cx="17" cy="6" r="1.3"/><line x1="17" y1="2" x2="17" y2="4.7"/><line x1="13.5" y1="8" x2="15.9" y2="6.7"/><line x1="20.5" y1="8" x2="18.1" y2="6.7"/><line x1="9" y1="2" x2="13" y2="2"/><line x1="9" y1="10" x2="13" y2="10"/></svg>`

        // ── Clock ────────────────────────────────────────────────────────
        function updateClock() {
            const d = new Date()
            const p = n => n.toString().padStart(2, '0')
            clockEl.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`
        }
        setInterval(updateClock, 1000)
        updateClock()

        // ── Helpers ──────────────────────────────────────────────────────
        function esc(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        }
        function fmt(s) {
            s = Math.max(0, s | 0)
            return `${s / 60 | 0}:${(s % 60).toString().padStart(2,'0')}`
        }

        // ── Trigger card HTML ────────────────────────────────────────────
        function buildTriggerHtml(b) {
            let micHtml = MIC_SVG
            if (b.muteall) {
                micHtml += ' alle aus'
            } else if (b.micColors && b.micColors.length) {
                micHtml += ' '
                for (const { name, color } of b.micColors)
                    micHtml += `<span${color ? ` class="color-${color}"` : ''}>${esc(name)}</span> `
            } else {
                micHtml += ' -'
            }

            const lightBadge = b.light
                ? `<span style="font-size:0.72rem;color:#e5c07b;border:1px solid #e5c07b55;border-radius:3px;padding:0 0.3rem;margin-left:0.4rem">✦ Licht</span>`
                : ''

            const playDot = b.isPlaying
                ? `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#98c379;box-shadow:0 0 6px #98c37988;margin-left:0.4rem;animation:pulse 1.2s ease-in-out infinite"></span>`
                : ''

            return `
                <div class="trigger-row">
                    <div class="trigger-info">
                        <div class="trigger-mic">${micHtml}</div>
                        <div class="trigger-music">${TAPE_SVG} ${b.musicLabel ? esc(b.musicLabel) : '-'}${lightBadge}</div>
                    </div>
                    ${b.note ? `<div class="trigger-note" style="font-size:0.85rem">${esc(b.note)}</div>` : ''}
                    <div style="display:flex;align-items:center;padding-right:0.5rem">${playDot}</div>
                </div>
                ${b.isNext ? '<div class="live-next-label">▶ Nächste Cue</div>' : ''}
            `
        }

        // ── Script render ────────────────────────────────────────────────
        let lastNextCue   = null
        let userScrolled  = false
        let scrollTimer   = null

        scrollEl.addEventListener('wheel', () => {
            userScrolled = true
            clearTimeout(scrollTimer)
            scrollTimer = setTimeout(() => { userScrolled = false }, 4000)
        }, { passive: true })

        function renderScript(blocks, nextCue) {
            let nextBlockIdx = -1
            for (let i = 0; i < blocks.length; i++) {
                if (blocks[i].type === 'trigger' && blocks[i].isNext)    { nextBlockIdx = i; break }
            }
            if (nextBlockIdx < 0) {
                for (let i = 0; i < blocks.length; i++) {
                    if (blocks[i].type === 'trigger' && blocks[i].isCurrent) { nextBlockIdx = i; break }
                }
            }

            const frag = document.createDocumentFragment()
            for (let i = 0; i < blocks.length; i++) {
                const b = blocks[i]
                const wrap = document.createElement('div')
                const isPast = nextBlockIdx >= 0 && i < nextBlockIdx

                if (b.type === 'trigger') {
                    if (b.isNext) {
                        wrap.className = 'live-block-next'
                        wrap.id = 'next-anchor'
                    } else if (b.isCurrent) {
                        wrap.className = isPast ? 'live-block-past live-block-current' : 'live-block-current'
                    } else if (isPast) {
                        wrap.className = 'live-block-past'
                    }
                    const card = document.createElement('div')
                    card.className = 'trigger'
                    card.innerHTML = buildTriggerHtml(b)
                    wrap.appendChild(card)
                } else {
                    if (isPast) wrap.className = 'live-block-past'
                    const inner = document.createElement('div')
                    inner.className = 'live-text'
                    inner.innerHTML = b.html
                    wrap.appendChild(inner)
                }
                frag.appendChild(wrap)
            }

            blocksEl.innerHTML = ''
            blocksEl.appendChild(frag)

            if (!userScrolled || lastNextCue !== nextCue) {
                const anchor = document.getElementById('next-anchor')
                if (anchor) {
                    const top = anchor.offsetTop - scrollEl.clientHeight * 0.35
                    scrollEl.scrollTo({ top: Math.max(0, top), behavior: lastNextCue !== nextCue ? 'smooth' : 'instant' })
                }
                lastNextCue = nextCue
            }
        }

        // ── Audio panel (rAF-based smooth update) ────────────────────────
        // Map<cueIdx, { el, fillEl, timeEl, item }>
        const audioRows = new Map()

        function calcProgress(item) {
            const now     = performance.now()
            const elapsed = (now - item.receivedAt) / 1000
            const ct      = item.currentTime + elapsed
            const start   = item.loopStart
            const end     = item.loopEnd
            const range   = end - start

            if (item.isLoop) {
                // Position within current loop iteration (wraps)
                const pos = range > 0 ? ((ct - start) % range + range) % range : 0
                const pct = range > 0 ? Math.min(1, pos / range) : 0
                const remaining = range > 0 ? range - pos : 0
                return { pct, remaining }
            } else {
                const pct = range > 0 ? Math.min(1, (ct - start) / range) : 0
                const remaining = range > 0 ? Math.max(0, end - ct) : 0
                return { pct, remaining }
            }
        }

        function rafUpdate() {
            requestAnimationFrame(rafUpdate)
            for (const { fillEl, timeEl, item } of audioRows.values()) {
                const { pct, remaining } = calcProgress(item)
                fillEl.style.width = (pct * 100).toFixed(2) + '%'
                timeEl.textContent = '-' + fmt(remaining)
            }
        }
        requestAnimationFrame(rafUpdate)

        function syncAudio(items) {
            const seen = new Set()
            const now  = performance.now()

            for (const item of items) {
                seen.add(item.cueIdx)
                item.receivedAt = now

                if (audioRows.has(item.cueIdx)) {
                    // Update item reference (new currentTime snapshot)
                    audioRows.get(item.cueIdx).item = item
                } else {
                    // Create new row and animate in
                    const row = document.createElement('div')
                    row.className = 'audio-row entering'

                    const label = document.createElement('div')
                    label.className = 'audio-label'
                    label.innerHTML = esc(item.label) + (item.isLoop
                        ? '<span class="audio-loop-badge">⟳ Loop</span>'
                        : '')

                    const barWrap = document.createElement('div')
                    barWrap.className = 'audio-bar-wrap'
                    const fill = document.createElement('div')
                    fill.className = 'audio-bar-fill' + (item.isLoop ? ' audio-loop-fill' : '')
                    fill.style.width = '0%'
                    barWrap.appendChild(fill)

                    const timeEl = document.createElement('div')
                    timeEl.className = 'audio-time'
                    timeEl.textContent = ''

                    row.append(label, barWrap, timeEl)
                    audioPanEl.appendChild(row)

                    // Trigger enter animation on next frame
                    requestAnimationFrame(() => row.classList.remove('entering'))

                    audioRows.set(item.cueIdx, { el: row, fillEl: fill, timeEl, item })
                }
            }

            // Remove rows that are no longer playing
            for (const [cueIdx, { el }] of audioRows) {
                if (seen.has(cueIdx)) continue
                el.classList.add('leaving')
                el.addEventListener('transitionend', () => {
                    el.remove()
                    audioRows.delete(cueIdx)
                }, { once: true })
                // Fallback: delete after 400ms in case transitionend doesn't fire
                setTimeout(() => { if (audioRows.has(cueIdx)) { el.remove(); audioRows.delete(cueIdx) } }, 400)
            }
        }

        // ── Main render ──────────────────────────────────────────────────
        function render(state) {
            const { blocks, nextCue, timecode, audioProgress } = state

            // TC display
            if (timecode) {
                tcEl.textContent = timecode
                tcEl.classList.add('tc-active')
            } else {
                tcEl.textContent = ''
                tcEl.classList.remove('tc-active')
            }

            renderScript(blocks, nextCue)
            syncAudio(audioProgress || [])
        }

        // ── Controls ─────────────────────────────────────────────────────
        btnGo.addEventListener('click',   () => { userScrolled = false; window.electronAPI.liveGo() })
        btnBack.addEventListener('click', () => { userScrolled = false; window.electronAPI.liveBack() })

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter')            { e.preventDefault(); userScrolled = false; window.electronAPI.liveGo() }
            if (e.key === 'Backspace' || e.key === 'ArrowLeft') { e.preventDefault(); userScrolled = false; window.electronAPI.liveBack() }
        })

        window.electronAPI.onLiveState(render)
    </script>
</body>
</html>
