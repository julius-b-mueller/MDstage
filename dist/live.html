<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self'; media-src 'self' blob:;">
    <title>Live-Ansicht</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <script src="i18n.js"></script>
    <style>
        /* ── Layout ─────────────────────────────────────────────────────── */
        html, body { height: 100%; overflow: hidden; }
        body { display: flex; flex-direction: column; background-color: #282c34; }

        /* ── Header ─────────────────────────────────────────────────────── */
        .live-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 0.6rem 1.5rem;
            background: #21252b;
            border-bottom: 1px solid #383c44;
            flex-shrink: 0;
            z-index: 20;
            box-shadow: 0 3px 8px rgba(0,0,0,0.35);
        }
        .live-header:has(+ .live-info-bar.empty) {
            box-shadow: 0 5px 16px rgba(0,0,0,0.5);
        }
        .live-header .clock    { font-size: 2.4rem; line-height: 2.8rem; width: auto; min-width: 9rem; margin-right: 0; }
        .live-header .tc-display { font-size: 1.5rem; line-height: 2.8rem; margin-right: 0; padding: 0 0.7rem; }

        /* ── State info bar ──────────────────────────────────────────────── */
        .live-info-bar {
            display: flex;
            align-items: stretch;
            flex-shrink: 0;
            background: #1c2028;
            border-bottom: 1px solid #2c313a;
            font-size: 1.05rem;
            min-height: 2.6rem;
            overflow: hidden;
            box-shadow: 0 5px 16px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }
        .live-info-bar.empty { min-height: 0; border-bottom: none; }
        .live-info-cell {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 1.4rem;
            border-right: 1px solid #2c313a;
            white-space: nowrap;
            overflow: hidden;
        }
        .live-info-cell:last-child { border-right: none; }
        .live-info-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #4b5263;
            flex-shrink: 0;
        }
        .live-info-device-state { font-weight: 600; }
        .live-info-mics  { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
        .live-info-mics .mic-chip {
            border-radius: 3px;
            padding: 0.05rem 0.45rem;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .live-info-mics .mic-all-off { color: #e06c75; font-style: italic; }
        .live-info-mics .mic-group { display: inline-flex; align-items: center; gap: 0; border: 1px solid #4b5263; border-radius: 4px; padding: 0 0.3rem 0 0; overflow: hidden; }
        .live-info-mics .mic-group-name { font-weight: 700; padding: 0.05rem 0.45rem; font-size: 0.95rem; background: rgba(255,255,255,0.06); }
        .live-info-mics .mic-group-sep { color: #5c6370; font-size: 0.85rem; }
        .live-info-mics .mic-group .mic-chip { font-weight: 500; }

        /* ── Mic group chips inside trigger cards ────────────────────────── */
        .trigger-mic { display: flex; align-items: center; flex-wrap: wrap; gap: 0.25rem; }
        .trigger-mic .mic-group { display: inline-flex; align-items: center; gap: 0; border: 1px solid #4b5263; border-radius: 4px; padding: 0 0.3rem 0 0; overflow: hidden; }
        .trigger-mic .mic-group-name { font-weight: 700; padding: 0.05rem 0.4rem; font-size: inherit; background: rgba(255,255,255,0.06); }
        .trigger-mic .mic-group-sep { color: #5c6370; font-size: 0.85em; }
        .trigger-mic .mic-chip { border-radius: 3px; padding: 0.05rem 0.35rem; font-size: inherit; font-weight: 500; }
        .trigger-mic .mic-all-off { color: #e06c75; font-style: italic; }

        /* ── Show progress bar ───────────────────────────────────────────── */
        .show-progress-bar {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 9px 12px;
            background: #272b32;
            border-top: 1px solid #383c44;
            border-bottom: 1px solid #383c44;
            flex-shrink: 0;
            box-shadow: 0 -5px 16px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }
        .audio-panel.has-audio ~ .show-progress-bar {
            box-shadow: 0 -3px 8px rgba(0,0,0,0.3);
        }
        .show-progress-bar.pb-hidden { display: none; }
        .progress-chapter-text {
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .progress-chapter-main { color: #abb2bf; }
        .progress-chapter-sub  { color: #5c6370; margin-left: 0.35rem; }
        .progress-segs-wrap {
            display: flex;
            gap: 3px;
            height: 5px;
        }
        .progress-seg {
            background: #383c44;
            border-radius: 3px;
            overflow: hidden;
            min-width: 3px;
        }
        .progress-fill {
            height: 100%;
            background: rgba(255,255,255,0.5);
            border-radius: 3px;
        }

        /* ── Script area ─────────────────────────────────────────────────── */
        .script-area { flex: 1; min-height: 0; overflow: hidden; position: relative; }
        .script-scroll { height: 100%; overflow: hidden; }
        #script-blocks { position: relative; will-change: transform; padding: 4rem 0; transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1); }

        /* ── Block styling ──────────────────────────────────────────────── */
        .live-text h1, .live-text h2, .live-text h3 {
            position: static !important;
            box-shadow: none !important;
            margin-top: 0;
            font-size: 1.8rem;
        }
        .live-text p { margin: 0.6rem 1.5rem; font-size: 1.4rem; line-height: 1.7; }
        .live-block-current .trigger { border-left-color: #e5c07b55; }

        /* Next cue: white border + white glow, no thick left stripe */
        .live-block-next .trigger {
            border: 2px solid rgba(255,255,255,0.85) !important;
            background-color: #1e2430 !important;
            box-shadow: 0 0 18px rgba(255,255,255,0.35), 0 0 50px rgba(255,255,255,0.12), black 0 0 14px;
        }
        .live-block-next .trigger .trigger-mic,
        .live-block-next .trigger .trigger-music,
        .live-block-next .trigger .trigger-light { font-size: 1.5rem; }
        .live-block-next .trigger .trigger-note { font-size: 1.9rem; }

        /* ── Variant group ──────────────────────────────────────────────── */
        .live-variant-group {
            display: flex;
            gap: 0.8rem;
            margin: 1.2rem 1.5rem;
        }
        .live-variant-group .trigger {
            flex: 1;
            margin: 0 !important;
            cursor: pointer !important;
            pointer-events: auto !important;
            transition: opacity 0.2s, box-shadow 0.2s;
        }
        /* All variants blink when none is selected yet */
        .live-variant-group.needs-selection .trigger {
            animation: variant-blink 1s ease-in-out infinite;
        }
        /* Selected variant: full brightness, stop blinking */
        .live-variant-group .trigger.variant-selected {
            animation: none !important;
            opacity: 1 !important;
        }
        /* Unselected siblings: dim */
        .live-variant-group:not(.needs-selection) .trigger:not(.variant-selected) {
            opacity: 0.35;
        }
        /* Inside a next-group, apply next styling to each variant */
        .live-block-next .live-variant-group .trigger {
            border: 2px solid rgba(255,255,255,0.85) !important;
            background-color: #1e2430 !important;
            box-shadow: 0 0 14px rgba(255,255,255,0.28), black 0 0 10px;
        }
        .live-block-next .live-variant-group .trigger.variant-selected {
            box-shadow: 0 0 18px rgba(255,255,255,0.45), black 0 0 10px;
        }

        @keyframes variant-blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.45; }
        }

        .trigger .trigger-actions  { display: none; }
        .trigger .trigger-move-btns { display: none; }
        .trigger { cursor: default !important; pointer-events: none; margin: 1.2rem 1.5rem; padding: 1rem 1.2rem; }
        .trigger .trigger-info { flex: 1; min-width: 0; }
        .trigger .trigger-mic,
        .trigger .trigger-music,
        .trigger .trigger-light,
        .trigger .trigger-osc { font-size: 1.05rem; margin-top: 0.3rem; }
        .trigger-slf { font-size: 0.85rem; font-weight: bold; margin-top: 0.3rem; }
        .trigger-slf--start  { color: #98c379; }
        .trigger-slf--loop   { color: #61afef; }
        .trigger-slf--finish { color: #e5c07b; }
        .trigger-slf--bridge { color: #c678dd; }
        .trigger .trigger-note {
            font-size: 1.3rem;
            max-width: 45%;
            padding: 5px 8px;
        }
/* ── Audio progress ──────────────────────────────────────────────── */
        .audio-panel {
            flex-shrink: 0;
            background: #2c313a;
            border-top: 1px solid transparent;
            box-shadow: 0 -5px 16px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
            padding: 0 1.2rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            max-height: 0;
            transition: border-color 0.28s, max-height 0.28s ease;
        }
        .audio-panel.has-audio {
            border-top-color: #383c44;
            max-height: 16rem;
        }
        .audio-vol-wrap {
            width: 5rem;
            height: 8px;
            background: #2c313a;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .audio-vol-fill {
            height: 100%;
            background: #61afef;
            border-radius: 4px;
            will-change: width;
            transition: background 0.3s;
        }
        .audio-vol-fill.low { background: #e5c07b; }

        .audio-row {
            display: grid;
            grid-template-columns: minmax(0, 16rem) 1fr auto auto auto auto;
            align-items: center;
            gap: 0.7rem;
            font-size: 1.1rem;
            overflow: hidden;
            max-height: 4.5rem;
            opacity: 1;
            padding: 0.7rem 0;
            transition: max-height 0.28s ease, opacity 0.28s ease, padding 0.28s ease;
        }
        .audio-row.entering, .audio-row.leaving {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
        }
        .audio-label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            min-width: 0;
        }
        .audio-label-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #abb2bf;
            min-width: 0;
        }
        .audio-loop-badge {
            font-size: 0.85rem;
            color: #c678dd;
            border: 1px solid #c678dd55;
            border-radius: 3px;
            padding: 0 0.3rem;
            flex-shrink: 0;
        }
        .audio-bar-wrap {
            height: 10px;
            background: #383c44;
            border-radius: 5px;
            overflow: hidden;
        }
        .audio-bar-fill {
            height: 100%;
            background: #98c379;
            border-radius: 5px;
            will-change: width;
        }
        .audio-loop-fill { background: #c678dd; }
        .audio-time {
            font-variant-numeric: tabular-nums;
            color: #5c6370;
            font-size: 0.95rem;
            white-space: nowrap;
            text-align: right;
        }
        .audio-stop-btn {
            border: none;
            background: none;
            color: #5c6370;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0 0.2rem;
            line-height: 1;
            flex-shrink: 0;
            transition: color 0.15s;
        }
        .audio-stop-btn:hover { color: #e06c75; }

        /* ── Bottom bar ──────────────────────────────────────────────────── */
        .bottom-bar {
            display: flex;
            gap: 1rem;
            padding: 0.9rem 1.5rem;
            background: #21252b;
            border-top: 1px solid #383c44;
            flex-shrink: 0;
            box-shadow: 0 -3px 8px rgba(0,0,0,0.35);
            position: relative;
            z-index: 10;
        }
        .ctrl-btn {
            flex: 1;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.3rem;
            font-family: inherit;
            font-weight: 600;
            padding: 0.85rem 1rem;
            transition: background 0.1s, transform 0.05s;
            user-select: none;
            letter-spacing: 0.02em;
        }
        .ctrl-btn:active { transform: scale(0.97); }
        .btn-back { background: #383c44; color: #abb2bf; max-width: 12rem; }
        .btn-back:hover { background: #4b5263; }
        .btn-go   { background: #98c379; color: #1e2127; }
        .btn-go:hover { background: #a8d389; }
        .btn-go:disabled { background: #383c44; color: #5c6370; cursor: not-allowed; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.35; }
        }

        /* Pending outro indicator */
        .outro-pending-bar-wrap {
            height: 4px;
            background: #2c313a;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.6rem;
        }
        .outro-pending-bar-fill {
            height: 100%;
            background: #e5c07b;
            border-radius: 2px;
            will-change: width;
            transition: background 0.3s;
        }
        .autocue-pending-bar-wrap {
            height: 4px;
            background: #2c313a;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.6rem;
        }
        .autocue-pending-bar-fill {
            height: 100%;
            background: #98c379;
            border-radius: 2px;
            will-change: width;
        }
    </style>
</head>
<body>
    <div class="live-header">
        <div class="clock" id="live-clock">00:00:00</div>
        <div class="tc-display" id="live-tc">--:--:--:--</div>
    </div>

    <div class="live-info-bar empty" id="live-info-bar"></div>

    <div class="script-area">
        <div class="script-scroll" id="script-scroll">
            <div id="script-blocks"></div>
        </div>
    </div>

    <div class="audio-panel" id="audio-panel"></div>
    <div class="show-progress-bar" id="show-progress-bar"></div>

    <div class="bottom-bar">
        <button class="ctrl-btn btn-back" id="btn-back" tabindex="-1" data-i18n="live.back">◀ Back</button>
        <button class="ctrl-btn btn-go"   id="btn-go"   tabindex="-1" data-i18n="live.go">Go ▶</button>
    </div>
    <script src="live.js"></script>
</body>
</html>
