<!DOCTYPE html>
<html>
<head>
    <title>Live-Ansicht</title>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a1d23;
            color: #abb2bf;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Header bar ── */
        .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.6rem 1rem;
            background: #21252b;
            border-bottom: 1px solid #383c44;
            flex-shrink: 0;
        }
        .clock-tc {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
            margin-right: auto;
        }
        .live-clock {
            font-size: 1.5rem;
            font-variant-numeric: tabular-nums;
            color: #abb2bf;
            font-weight: 300;
        }
        .live-tc {
            font-size: 0.9rem;
            font-variant-numeric: tabular-nums;
            color: #5c6370;
            font-family: 'SF Mono', 'Fira Code', monospace;
            min-height: 1.1em;
        }
        .live-tc.active { color: #e5c07b; }

        /* ── Go / Back buttons ── */
        .ctrl-btns {
            display: flex;
            gap: 0.75rem;
        }
        .ctrl-btn {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 600;
            padding: 0.55rem 1.6rem;
            transition: background 0.1s, transform 0.05s;
            user-select: none;
        }
        .ctrl-btn:active { transform: scale(0.96); }
        .btn-back {
            background: #383c44;
            color: #abb2bf;
        }
        .btn-back:hover { background: #4b5263; }
        .btn-go {
            background: #98c379;
            color: #1a1d23;
            min-width: 7rem;
        }
        .btn-go:hover { background: #a8d389; }
        .btn-go:disabled { background: #3a4535; color: #5c6370; cursor: default; }

        /* ── Script display ── */
        .script-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .script-scroll {
            height: 100%;
            overflow-y: auto;
            padding: 3rem 2rem 3rem;
            scroll-behavior: smooth;
        }
        .script-scroll::-webkit-scrollbar { width: 6px; }
        .script-scroll::-webkit-scrollbar-track { background: transparent; }
        .script-scroll::-webkit-scrollbar-thumb { background: #383c44; border-radius: 3px; }

        /* Fade mask top + bottom */
        .script-wrap::before,
        .script-wrap::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 4rem;
            z-index: 2;
            pointer-events: none;
        }
        .script-wrap::before {
            top: 0;
            background: linear-gradient(to bottom, #1a1d23, transparent);
        }
        .script-wrap::after {
            bottom: 0;
            background: linear-gradient(to top, #1a1d23, transparent);
        }

        /* ── Block styles ── */
        .live-block {
            margin-bottom: 0.5rem;
            transition: opacity 0.3s;
        }
        .live-block.past { opacity: 0.25; }
        .live-block.future { opacity: 0.5; }
        .live-block.current { opacity: 1; }

        .block-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #abb2bf;
            white-space: pre-wrap;
        }
        .block-text h1, .block-text h2, .block-text h3 {
            margin-bottom: 0.2rem;
        }
        /* Render markdown-ish headings from raw markdown */
        .live-h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #e6e6e6;
            margin-bottom: 0.1rem;
        }
        .live-h2 {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ccc;
            margin-bottom: 0.1rem;
        }
        .live-body {
            font-size: 0.92rem;
            color: #abb2bf;
            line-height: 1.6;
        }

        .block-trigger {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            border-left: 3px solid #4b5263;
            background: #21252b;
            font-size: 0.85rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: #7c8898;
        }
        .block-trigger.is-current {
            border-left-color: #61afef;
            background: #1d2736;
            color: #c8d0dc;
        }
        .block-trigger.is-playing {
            border-left-color: #98c379;
            background: #1c2820;
            color: #c8d0dc;
        }
        .block-trigger.is-current.is-playing {
            border-left-color: #98c379;
            background: #1c2820;
        }
        .cue-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #4b5263;
            flex-shrink: 0;
        }
        .block-trigger.is-current .cue-dot { background: #61afef; }
        .block-trigger.is-playing .cue-dot {
            background: #98c379;
            box-shadow: 0 0 6px #98c37966;
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .light-tag {
            font-size: 0.7rem;
            color: #e5c07b;
            border: 1px solid #e5c07b55;
            border-radius: 3px;
            padding: 0 0.3rem;
            margin-left: auto;
        }

        /* ── Current cue highlight anchor ── */
        #current-anchor { scroll-margin-top: 45vh; }
    </style>
</head>
<body>
    <div class="header">
        <div class="clock-tc">
            <span class="live-clock" id="live-clock">00:00:00</span>
            <span class="live-tc" id="live-tc"></span>
        </div>
        <div class="ctrl-btns">
            <button class="ctrl-btn btn-back" id="btn-back">◀ Back</button>
            <button class="ctrl-btn btn-go" id="btn-go">Go ▶</button>
        </div>
    </div>
    <div class="script-wrap">
        <div class="script-scroll" id="script-scroll">
            <div id="script-blocks"></div>
        </div>
    </div>
    <script>
        const clockEl   = document.getElementById('live-clock')
        const tcEl      = document.getElementById('live-tc')
        const blocksEl  = document.getElementById('script-blocks')
        const scrollEl  = document.getElementById('script-scroll')
        const btnGo     = document.getElementById('btn-go')
        const btnBack   = document.getElementById('btn-back')

        let state = null

        function updateClock() {
            const d = new Date()
            const pad = n => n.toString().padStart(2, '0')
            clockEl.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`
        }
        setInterval(updateClock, 1000)
        updateClock()

        function renderText(raw) {
            // Very light markdown: detect # headings, otherwise plain text
            const lines = raw.split('\n')
            const out = []
            for (const line of lines) {
                const h1 = line.match(/^# (.*)/)
                const h2 = line.match(/^## (.*)/)
                const h3 = line.match(/^### (.*)/)
                if (h1) out.push(`<div class="live-h1">${escHtml(h1[1])}</div>`)
                else if (h2) out.push(`<div class="live-h2">${escHtml(h2[1])}</div>`)
                else if (h3) out.push(`<div class="live-h2">${escHtml(h3[1])}</div>`)
                else if (line.trim()) out.push(`<div class="live-body">${escHtml(line)}</div>`)
            }
            return out.join('')
        }

        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        }

        function render(newState) {
            state = newState
            const { blocks, currentCue, timecode } = state

            // TC display
            if (timecode) {
                tcEl.textContent = timecode
                tcEl.classList.add('active')
            } else {
                tcEl.textContent = ''
                tcEl.classList.remove('active')
            }

            // Figure out "position" — index of the first current-cue block
            let currentBlockPos = -1
            for (let i = 0; i < blocks.length; i++) {
                if (blocks[i].type === 'trigger' && blocks[i].isCurrent) {
                    currentBlockPos = i
                    break
                }
            }

            blocksEl.innerHTML = ''
            let anchorSet = false
            for (let i = 0; i < blocks.length; i++) {
                const b = blocks[i]
                const div = document.createElement('div')
                div.className = 'live-block'

                let posClass = 'future'
                if (currentBlockPos < 0) {
                    posClass = 'future'
                } else if (i < currentBlockPos) {
                    posClass = 'past'
                } else if (b.type === 'trigger' && b.isCurrent) {
                    posClass = 'current'
                } else {
                    posClass = 'future'
                }
                div.classList.add(posClass)

                if (b.type === 'text') {
                    div.innerHTML = `<div class="block-text">${renderText(b.content)}</div>`
                } else {
                    const cls = [
                        'block-trigger',
                        b.isCurrent ? 'is-current' : '',
                        b.isPlaying ? 'is-playing' : '',
                    ].filter(Boolean).join(' ')
                    const lightTag = b.light ? '<span class="light-tag">Licht</span>' : ''
                    div.innerHTML = `<div class="${cls}"><span class="cue-dot"></span><span>${escHtml(b.label)}</span>${lightTag}</div>`
                }

                if (b.type === 'trigger' && b.isCurrent && !anchorSet) {
                    div.id = 'current-anchor'
                    anchorSet = true
                }

                blocksEl.appendChild(div)
            }

            // Scroll current cue into center
            const anchor = document.getElementById('current-anchor')
            if (anchor) {
                const scrollTop = anchor.offsetTop - scrollEl.clientHeight / 2 + anchor.offsetHeight / 2
                scrollEl.scrollTo({ top: Math.max(0, scrollTop), behavior: 'smooth' })
            }
        }

        btnGo.addEventListener('click', () => window.electronAPI.liveGo())
        btnBack.addEventListener('click', () => window.electronAPI.liveBack())

        window.electronAPI.onLiveState(render)

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); window.electronAPI.liveGo() }
            if (e.key === 'Backspace' || e.key === 'ArrowLeft') { e.preventDefault(); window.electronAPI.liveBack() }
        })
    </script>
</body>
</html>
