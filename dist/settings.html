<!DOCTYPE html>
<html>
<head>
    <title>Einstellungen</title>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <style>
        body { padding: 1.5rem; padding-bottom: 5rem; }
        .field { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: #5c6370; text-transform: uppercase; letter-spacing: 0.05em; }
        select, input[type="number"], input[type="text"] {
            width: 100%;
            background: #383c44;
            color: #abb2bf;
            border: 1px solid #4b5263;
            padding: 0.5rem 0.75rem;
            border-radius: 5px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
        }
        select { cursor: pointer; }
        select:focus, input[type="number"]:focus, input[type="text"]:focus { outline: none; border-color: #61afef; }
        .hint { font-size: 0.78rem; color: #5c6370; margin: 0.3rem 0 0; }
        .section-title {
            font-size: 0.75rem;
            color: #5c6370;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 1.5rem 0 0.8rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid #383c44;
        }
        .section-title:first-child { margin-top: 0; }
        .offset-row { display: flex; gap: 0.5rem; align-items: flex-end; }
        .offset-row input { flex: 1; }
        .actions {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            padding: 0.75rem 1.5rem;
            background: #282c34;
            border-top: 1px solid #383c44;
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            z-index: 10;
        }
        .btn {
            background: #4b5263;
            color: #abb2bf;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95rem;
            font-family: inherit;
            white-space: nowrap;
        }
        .btn:hover { background: #5c6370; }
        .btn-primary { background: #61afef; color: #282c34; }
        .btn-primary:hover { background: #71bfff; }
        .btn-active { background: #e5c07b; color: #282c34; }
        .btn-active:hover { background: #f5d08b; }
        .error { color: #e06c75; font-size: 0.9rem; margin-top: 1rem; }
        .device-warning { color: #e06c75; font-size: 0.8rem; margin: 0.3rem 0 0; }
        .midi-learn-row { display: flex; gap: 0.5rem; align-items: center; }
        .midi-learn-row span { flex: 1; background: #383c44; border: 1px solid #4b5263; padding: 0.5rem 0.75rem; border-radius: 5px; font-size: 0.92rem; color: #7c8898; }
        .midi-learn-row span.assigned { color: #abb2bf; }
    </style>
</head>
<body>
    <div id="hostname-label" style="font-size:0.78rem;color:#5c6370;margin-bottom:1rem;"></div>
    <div class="section-title">Audio-Ausgabe</div>
    <div class="field">
        <label>Haupt-Audio</label>
        <select id="main-audio-device">
            <option value="">— Standard —</option>
        </select>
    </div>
    <div class="field">
        <label>Monitor-Mix</label>
        <select id="monitor-audio-device">
            <option value="">— kein Monitor —</option>
        </select>
    </div>
    <div class="field">
        <label>Monitor-Versatz (ms, negativ = vorziehen)</label>
        <div class="offset-row">
            <input type="number" id="monitor-offset" value="0" step="1">
            <button class="btn" id="metro-btn">▶ Latenz-Test</button>
        </div>
    </div>

    <div class="section-title">MIDI</div>
    <div class="field">
        <label>X32 Fernbedienung</label>
        <select id="x32-device">
            <option value="">— kein Gerät —</option>
        </select>
    </div>
    <div class="field">
        <label>Trigger-Noten</label>
        <select id="trigger-device">
            <option value="">— kein Gerät —</option>
        </select>
    </div>
    <div class="field">
        <label>MIDI-Timecode</label>
        <select id="tc-device">
            <option value="">— kein Gerät —</option>
        </select>
    </div>
    <div class="section-title">Live-Tasten (MIDI-Eingang)</div>
    <div class="field">
        <label>Go</label>
        <div class="midi-learn-row">
            <span id="go-midi-label">— nicht belegt —</span>
            <button class="btn" id="go-learn-btn">Lernen</button>
            <button class="btn" id="go-clear-btn">✕</button>
        </div>
    </div>
    <div class="field">
        <label>Back</label>
        <div class="midi-learn-row">
            <span id="back-midi-label">— nicht belegt —</span>
            <button class="btn" id="back-learn-btn">Lernen</button>
            <button class="btn" id="back-clear-btn">✕</button>
        </div>
    </div>

    <div class="section-title">Text-Editor</div>
    <div class="field">
        <label>In Editor öffnen (Rechtsklick)</label>
        <select id="editor-app">
            <option value="">— deaktiviert —</option>
            <option value="vscode">VS Code</option>
            <option value="zed">Zed</option>
            <option value="custom">Custom…</option>
        </select>
    </div>
    <div class="field" id="custom-cmd-field" style="display:none">
        <label>Befehl</label>
        <input type="text" id="editor-custom-cmd" placeholder="z.B. myeditor {file}:{line}">
        <p class="hint">{file} = Dateipfad &nbsp;·&nbsp; {line} = Zeilennummer (1-basiert)</p>
    </div>

    <div class="actions">
        <button class="btn" id="cancel">Abbrechen</button>
        <button class="btn btn-primary" id="save">Speichern</button>
    </div>
    <script>
        // ── Metronome ────────────────────────────────────────────────────
        let metroActive = false
        let mainCtx = null, monCtx = null
        let metroTimer = null
        let deviceIdMap = new Map()  // label → deviceId

        function scheduleClick(ctx, time, freq) {
            const osc  = ctx.createOscillator()
            const gain = ctx.createGain()
            osc.connect(gain)
            gain.connect(ctx.destination)
            osc.frequency.value = freq
            osc.type = 'sine'
            gain.gain.setValueAtTime(0.45, time)
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.07)
            osc.start(time)
            osc.stop(time + 0.07)
        }

        async function startMetro() {
            const mainLabel = document.getElementById('main-audio-device').value
            const monLabel  = document.getElementById('monitor-audio-device').value
            const mainDev = deviceIdMap.get(mainLabel) || ''
            const monDev  = deviceIdMap.get(monLabel)  || ''

            mainCtx = new AudioContext()
            if (mainDev && mainCtx.setSinkId) await mainCtx.setSinkId(mainDev).catch(() => {})

            monCtx = monLabel ? new AudioContext() : null
            if (monCtx && monCtx.setSinkId) await monCtx.setSinkId(monDev).catch(() => {})

            const INTERVAL = 0.5   // seconds (120 BPM)
            let nextBeat = mainCtx.currentTime + 0.05
            let beat = 0

            metroTimer = setInterval(() => {
                const lookahead = mainCtx.currentTime + 0.12
                while (nextBeat < lookahead) {
                    const freq = (beat % 4 === 0) ? 1320 : 880   // accent on bar downbeat
                    scheduleClick(mainCtx, nextBeat, freq)
                    if (monCtx) {
                        const offsetS = (parseInt(document.getElementById('monitor-offset').value) || 0) / 1000
                        const monTime = monCtx.currentTime + (nextBeat - mainCtx.currentTime) + offsetS
                        scheduleClick(monCtx, Math.max(monCtx.currentTime + 0.005, monTime), freq)
                    }
                    nextBeat += INTERVAL
                    beat++
                }
            }, 25)
        }

        function stopMetro() {
            clearInterval(metroTimer)
            metroTimer = null
            if (mainCtx) { mainCtx.close(); mainCtx = null }
            if (monCtx)  { monCtx.close();  monCtx  = null }
        }

        // ── Init ─────────────────────────────────────────────────────────
        async function init() {
            const [settings, hn] = await Promise.all([
                window.electronAPI.getSettings(),
                window.electronAPI.getHostname(),
            ])
            document.getElementById('hostname-label').textContent = 'Dieser PC: ' + hn

            const mainAudioSel    = document.getElementById('main-audio-device')
            const monitorAudioSel = document.getElementById('monitor-audio-device')
            const monitorOffsetEl = document.getElementById('monitor-offset')
            const metroBtn        = document.getElementById('metro-btn')

            if (settings.monitorOffsetMs != null) monitorOffsetEl.value = settings.monitorOffsetMs

            try {
                const devices = await navigator.mediaDevices.enumerateDevices()
                const outputs = devices.filter(d => d.kind === 'audiooutput')
                const audioLabels = new Set()
                for (const dev of outputs) {
                    const label = dev.label || dev.deviceId
                    audioLabels.add(label)
                    if (!deviceIdMap.has(label)) deviceIdMap.set(label, dev.deviceId)
                    const o1 = new Option(label, label)
                    const o2 = new Option(label, label)
                    if (settings.mainAudioDevice === label)    o1.selected = true
                    if (settings.monitorAudioDevice === label) o2.selected = true
                    mainAudioSel.appendChild(o1)
                    monitorAudioSel.appendChild(o2)
                }
                if (settings.mainAudioDevice && !audioLabels.has(settings.mainAudioDevice))
                    mainAudioSel.insertAdjacentHTML('afterend',
                        '<p class="device-warning">Gerät „' + settings.mainAudioDevice + '" nicht gefunden – auf Standard zurückgefallen</p>')
                if (settings.monitorAudioDevice && !audioLabels.has(settings.monitorAudioDevice))
                    monitorAudioSel.insertAdjacentHTML('afterend',
                        '<p class="device-warning">Gerät „' + settings.monitorAudioDevice + '" nicht gefunden – Monitormix deaktiviert</p>')
            } catch (e) {
                document.body.insertAdjacentHTML('beforeend', '<p class="error">Audio-Geräte nicht verfügbar: ' + e.message + '</p>')
            }

            metroBtn.addEventListener('click', async () => {
                metroActive = !metroActive
                if (metroActive) {
                    metroBtn.textContent = '⏹ Latenz-Test'
                    metroBtn.classList.add('btn-active')
                    await startMetro()
                } else {
                    metroBtn.textContent = '▶ Latenz-Test'
                    metroBtn.classList.remove('btn-active')
                    stopMetro()
                }
            })

            // ── MIDI ──────────────────────────────────────────────────
            const x32Select     = document.getElementById('x32-device')
            const triggerSelect = document.getElementById('trigger-device')
            const tcSelect      = document.getElementById('tc-device')

            try {
                const midiAccess = await navigator.requestMIDIAccess({ sysex: true })
                const midiNames = new Set()
                for (const output of midiAccess.outputs.values()) {
                    midiNames.add(output.name)
                    const o1 = new Option(output.name, output.name)
                    const o2 = new Option(output.name, output.name)
                    const o3 = new Option(output.name, output.name)
                    if (settings.midiX32Device === output.name)     o1.selected = true
                    if (settings.midiTriggerDevice === output.name) o2.selected = true
                    if (settings.midiTCDevice === output.name)      o3.selected = true
                    x32Select.appendChild(o1)
                    triggerSelect.appendChild(o2)
                    tcSelect.appendChild(o3)
                }
                if (settings.midiX32Device && !midiNames.has(settings.midiX32Device))
                    x32Select.insertAdjacentHTML('afterend',
                        '<p class="device-warning">Gerät „' + settings.midiX32Device + '" nicht gefunden – MIDI-Ausgabe deaktiviert</p>')
                if (settings.midiTriggerDevice && !midiNames.has(settings.midiTriggerDevice))
                    triggerSelect.insertAdjacentHTML('afterend',
                        '<p class="device-warning">Gerät „' + settings.midiTriggerDevice + '" nicht gefunden – MIDI-Ausgabe deaktiviert</p>')
                if (settings.midiTCDevice && !midiNames.has(settings.midiTCDevice))
                    tcSelect.insertAdjacentHTML('afterend',
                        '<p class="device-warning">Gerät „' + settings.midiTCDevice + '" nicht gefunden – MIDI-Ausgabe deaktiviert</p>')
            } catch (e) {
                document.body.insertAdjacentHTML('beforeend', '<p class="error">MIDI nicht verfügbar: ' + e.message + '</p>')
            }

            // ── Live-Tasten MIDI Learn ────────────────────────────────
            let midiGoNote   = settings.midiGoNote   || null
            let midiBackNote = settings.midiBackNote || null
            let learningFor  = null  // 'go' | 'back'

            function midiNoteLabel(n) { return n ? `K${n.ch}  N${n.note}` : '— nicht belegt —' }
            function applyMidiLabel(which, note) {
                const el = document.getElementById(which + '-midi-label')
                el.textContent = midiNoteLabel(note)
                el.classList.toggle('assigned', !!note)
            }
            applyMidiLabel('go', midiGoNote)
            applyMidiLabel('back', midiBackNote)

            function stopLearn() {
                learningFor = null
                document.getElementById('go-learn-btn').classList.remove('btn-active')
                document.getElementById('go-learn-btn').textContent = 'Lernen'
                document.getElementById('back-learn-btn').classList.remove('btn-active')
                document.getElementById('back-learn-btn').textContent = 'Lernen'
            }

            try {
                const midiIn = await navigator.requestMIDIAccess({ sysex: false })
                for (const input of midiIn.inputs.values()) {
                    input.onmidimessage = (msg) => {
                        const [status, note, velocity] = msg.data
                        const type = status & 0xf0
                        const ch   = (status & 0x0f) + 1
                        if (type !== 0x90 || velocity === 0 || !learningFor) return
                        const assignment = { ch, note }
                        if (learningFor === 'go') {
                            midiGoNote = assignment
                            applyMidiLabel('go', assignment)
                        } else {
                            midiBackNote = assignment
                            applyMidiLabel('back', assignment)
                        }
                        stopLearn()
                    }
                }
            } catch {}

            function toggleLearn(which) {
                const was = learningFor
                stopLearn()
                if (was !== which) {
                    learningFor = which
                    const btn = document.getElementById(which + '-learn-btn')
                    btn.classList.add('btn-active')
                    btn.textContent = '⏹ Warte…'
                }
            }
            document.getElementById('go-learn-btn').addEventListener('click', () => toggleLearn('go'))
            document.getElementById('back-learn-btn').addEventListener('click', () => toggleLearn('back'))
            document.getElementById('go-clear-btn').addEventListener('click', () => { midiGoNote = null; applyMidiLabel('go', null); stopLearn() })
            document.getElementById('back-clear-btn').addEventListener('click', () => { midiBackNote = null; applyMidiLabel('back', null); stopLearn() })

            // ── Text-Editor ───────────────────────────────────────────
            const editorAppSel   = document.getElementById('editor-app')
            const customCmdField = document.getElementById('custom-cmd-field')
            const editorCustomEl = document.getElementById('editor-custom-cmd')

            if (settings.editorApp) editorAppSel.value = settings.editorApp
            if (settings.editorCustomCmd) editorCustomEl.value = settings.editorCustomCmd
            customCmdField.style.display = settings.editorApp === 'custom' ? '' : 'none'

            editorAppSel.addEventListener('change', () => {
                customCmdField.style.display = editorAppSel.value === 'custom' ? '' : 'none'
            })

            document.getElementById('cancel').addEventListener('click', () => { stopMetro(); window.close() })

            document.getElementById('save').addEventListener('click', async () => {
                stopMetro()
                await window.electronAPI.saveSettings({
                    mainAudioDevice:    mainAudioSel.value    || null,
                    monitorAudioDevice: monitorAudioSel.value || null,
                    monitorOffsetMs:    parseInt(monitorOffsetEl.value) || 0,
                    midiX32Device:      x32Select.value       || null,
                    midiTriggerDevice:  triggerSelect.value   || null,
                    midiTCDevice:       tcSelect.value        || null,
                    editorApp:          editorAppSel.value    || null,
                    editorCustomCmd:    editorCustomEl.value.trim(),
                    midiGoNote,
                    midiBackNote,
                })
                window.close()
            })
        }
        init()
    </script>
</body>
</html>
