<!DOCTYPE html>

<html>

<head>
    <title>Main Desk</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
</head>

<body>
    <div id="scene-sidebar">
        <div class="scene-sidebar-header">Szenen</div>
        <div id="scene-list"></div>
    </div>

    <div id="search-bar" class="hidden">
        <input id="search-input" type="text" placeholder="Suchen…" autocomplete="off" spellcheck="false">
        <span id="search-count"></span>
        <button id="search-prev" title="Vorheriges (Shift+Enter)">↑</button>
        <button id="search-next" title="Nächstes (Enter)">↓</button>
        <button id="search-close" title="Schließen (Esc)">×</button>
    </div>

    <div id="header-shield"></div>
    <div id="script-content"></div>
    <div class="sidebar-toggle-button button" style="font-size:1.4rem" title="Szenenübersicht (Strg+B)">☰</div>

    <div class="buttons">
        <div class="clock">00:00:00</div>
        <div class="tc-display">--:--:--:--</div>
        <!--
        <div class="button emoji-button power-button server-only">⭕</div>
        <div class="button emoji-button x32-button server-only">🎛️</div>
        -->
        <div class="button reload-button" style="font-size:1.4rem">↺</div>
        <div class="button current-trigger-button" style="font-size:1.4rem">⌖</div>
        <div class="button emergency em-mic"><img src="assets/em-mic.svg" alt=""></div>
        <div class="button emergency em-music"><img src="assets/em-music.svg" alt=""></div>
    </div>
    <script src="bundle.js"></script>
</body>

</html>
