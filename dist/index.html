<!DOCTYPE html>

<html>

<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob:; img-src 'self' data: blob:; media-src 'self' blob:; worker-src blob:;">
    <title>Main Desk</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
</head>

<body>
    <div id="scene-sidebar">
        <div class="scene-sidebar-header" data-i18n="sidebar.title">Szenen</div>
        <div id="scene-list"></div>
    </div>

    <div id="search-bar" class="hidden">
        <input id="search-input" type="text" data-i18n-ph="search.ph" placeholder="Suchen…" autocomplete="off" spellcheck="false">
        <span id="search-count"></span>
        <button id="search-prev" data-i18n-title="search.prev.title" title="Vorheriges (Shift+Enter)">↑</button>
        <button id="search-next" data-i18n-title="search.next.title" title="Nächstes (Enter)">↓</button>
        <button id="search-close" data-i18n-title="search.close.title" title="Schließen (Esc)">×</button>
    </div>

    <div id="header-shield"></div>
    <div id="script-content"></div>
    <div class="sidebar-toggle-button button" style="font-size:1.4rem" data-i18n-title="toolbar.sidebar.title" title="Szenenübersicht (Strg+B)">☰</div>

    <div class="buttons">
        <div class="clock">00:00:00</div>
        <div class="tc-display">--:--:--:--</div>
        <div class="button live-window-button" title="Live-Ansicht öffnen (Cmd+L)" style="font-size:1rem;font-weight:600;letter-spacing:.02em">LIVE</div>
        <div class="button lock-button" title="Bearbeitungssperre (Show-Modus)"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></div>
        <div class="button reload-button" style="font-size:1.4rem">↺</div>
        <div class="button current-trigger-button" style="font-size:1.4rem">⌖</div>
        <div class="button emergency em-light"><img src="assets/em-light.svg" alt=""></div>
        <div class="button emergency em-mic"><img src="assets/em-mic.svg" alt=""></div>
        <div class="button emergency em-music"><img src="assets/em-music.svg" alt=""></div>
    </div>
    <script src="i18n.js"></script>
    <script src="bundle.js"></script>
</body>

</html>
