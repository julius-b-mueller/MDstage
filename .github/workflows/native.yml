name: Native Build

# Builds the native (Rust) app for all five targets. Separate from build.yml, which
# still builds and releases the Electron app: this one only uploads artifacts.

on:
  push:
    branches: [native-rewrite]
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: rustup toolchain install stable --profile minimal
      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgtk-3-dev
      - run: cargo test --workspace

  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: rustup toolchain install stable --profile minimal
      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgtk-3-dev
      - run: cargo build --release -p mdstage-app
      - run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb -p mdstage-app --no-build
          # rpm takes no "-" in a version: 2.0.0-alpha.1 becomes 2.0.0~alpha.1.
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1 | tr - '~')
          cargo generate-rpm -p crates/mdstage-app --set-metadata "version = \"$version\""
          scripts/bundle-appimage.sh
          mkdir -p artifacts
          tar -czf artifacts/MDstage-linux-${{ matrix.arch }}.tar.gz -C target/release mdstage
          cp target/debian/*.deb artifacts/MDstage-linux-${{ matrix.arch }}.deb
          cp target/generate-rpm/*.rpm artifacts/MDstage-linux-${{ matrix.arch }}.rpm
          cp target/bundle/MDstage-linux-${{ matrix.arch }}.AppImage artifacts/
          ls -lh artifacts/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-linux-${{ matrix.arch }}
          path: artifacts/
          retention-days: 14

  windows:
    strategy:
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: rustup toolchain install stable --profile minimal
      - run: cargo build --release -p mdstage-app
      - run: |
          New-Item -ItemType Directory -Force -Path artifacts, target/bundle | Out-Null
          Copy-Item target/release/mdstage.exe artifacts/MDstage.exe
          Compress-Archive -Path artifacts/MDstage.exe -DestinationPath artifacts/MDstage-windows-${{ matrix.arch }}.zip
          Remove-Item artifacts/MDstage.exe
          # The installer. NSIS comes with most runner images; fetch it where it does not.
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\NSIS"
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          makensis /DVERSION=$version /DARCH=${{ matrix.arch }} scripts/windows-installer.nsi
          Copy-Item target/bundle/MDstage-windows-${{ matrix.arch }}-setup.exe artifacts/
          Get-ChildItem artifacts/
        shell: pwsh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-windows-${{ matrix.arch }}
          path: artifacts/
          retention-days: 14

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: rustup toolchain install stable --profile minimal
      - run: scripts/bundle-macos.sh --dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-macos-arm64
          path: target/bundle/MDstage-macos-arm64.dmg
          retention-days: 14
