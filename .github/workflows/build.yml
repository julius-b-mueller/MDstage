name: Build & Deploy

# The native (Rust) app and the website.
#
#   push to main            tests, then the website goes to GitHub Pages
#   push to native-rewrite  tests and packages for all five targets (artifacts only)
#   tag 2.0.0               tests, packages, GitHub release
#   tag 2.0.0-beta.1        the same, marked as a pre-release ("latest" stays as it is)
#
# A release tag has to be the version in Cargo.toml, and for a full release also the
# softwareVersion on the website; the `versions` job refuses the tag otherwise.

on:
  push:
    branches: [main, native-rewrite]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

permissions: read-all

jobs:

  # ── Tests (always) ────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: rustup toolchain install stable --profile minimal
      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgtk-3-dev
      - run: cargo test --workspace --locked

  # ── Dependencies: known vulnerabilities and licenses (always) ─────────────
  # Fails on a security advisory against a crate in Cargo.lock; "unmaintained" only warns.
  # Advisories that do not reach MDstage are listed, with the reason, in .cargo/audit.toml.
  # Also fails on a crate under a license about.toml does not accept, and when
  # THIRD-PARTY-LICENSES.txt no longer matches Cargo.lock (scripts/third-party-licenses.sh).
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: rustup toolchain install stable --profile minimal
      - run: |
          cargo install cargo-audit@0.22.2 --locked
          cargo install cargo-about@0.9.2 --locked --features cli
      - run: cargo audit
      - run: |
          scripts/third-party-licenses.sh
          if ! git diff --exit-code --stat THIRD-PARTY-LICENSES.txt; then
            echo "::error::THIRD-PARTY-LICENSES.txt is out of date: run scripts/third-party-licenses.sh and commit it."
            exit 1
          fi

  # ── Versions agree (tags only) ────────────────────────────────────────────
  versions:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - env:
          # Through the environment, not pasted into the script: a tag name is free text.
          TAG: ${{ github.ref_name }}
        run: |
          tag="$TAG"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          site=$(sed -n 's/.*"softwareVersion": "\(.*\)".*/\1/p' website/index.html | head -1)
          echo "tag $tag · Cargo.toml $cargo · website $site"
          if [ "$cargo" != "$tag" ]; then
            echo "::error::The tag is $tag, but Cargo.toml says $cargo."
            exit 1
          fi
          # A pre-release does not go on the website.
          case "$tag" in
            *-*) ;;
            *) if [ "$site" != "$tag" ]; then
                 echo "::error::The tag is $tag, but softwareVersion in website/index.html says $site."
                 exit 1
               fi ;;
          esac

  # ── Linux ─────────────────────────────────────────────────────────────────
  linux:
    if: github.ref_type == 'tag' || github.ref_name == 'native-rewrite' || github.event_name == 'workflow_dispatch'
    strategy:
      # One target failing must not take the other's packages with it.
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: rustup toolchain install stable --profile minimal
      - run: |
          sudo apt-get update
          # desktop-file-utils: appimagetool checks the .desktop file with it.
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgtk-3-dev desktop-file-utils
      - run: cargo build --release -p mdstage-app --locked
      - run: |
          cargo install cargo-deb@3.8.0 cargo-generate-rpm@0.21.0 --locked
          cargo deb -p mdstage-app --no-build
          # rpm takes no "-" in a version: 2.0.0-alpha.1 becomes 2.0.0~alpha.1.
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1 | tr - '~')
          cargo generate-rpm -p crates/mdstage-app --set-metadata "version = \"$version\""
          scripts/bundle-appimage.sh
          mkdir -p artifacts
          cp LICENSE THIRD-PARTY-LICENSES.txt target/release/
          tar -czf artifacts/MDstage-linux-${{ matrix.arch }}.tar.gz -C target/release mdstage LICENSE THIRD-PARTY-LICENSES.txt
          cp target/debian/*.deb artifacts/MDstage-linux-${{ matrix.arch }}.deb
          cp target/generate-rpm/*.rpm artifacts/MDstage-linux-${{ matrix.arch }}.rpm
          cp target/bundle/MDstage-linux-${{ matrix.arch }}.AppImage artifacts/
          ls -lh artifacts/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-${{ matrix.arch }}
          path: artifacts/
          retention-days: 14

  # ── Windows ───────────────────────────────────────────────────────────────
  windows:
    if: github.ref_type == 'tag' || github.ref_name == 'native-rewrite' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: rustup toolchain install stable --profile minimal
      - run: cargo build --release -p mdstage-app --locked
      - run: |
          New-Item -ItemType Directory -Force -Path artifacts, target/bundle | Out-Null
          # Without installing: the program and its license notices, zipped.
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item target/release/mdstage.exe portable/MDstage.exe
          Copy-Item LICENSE portable/LICENSE.txt
          Copy-Item THIRD-PARTY-LICENSES.txt portable/
          Compress-Archive -Path portable/* -DestinationPath artifacts/MDstage-windows-${{ matrix.arch }}-portable.zip
          # The installer. NSIS comes with most runner images; fetch it where it does not.
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --version 3.13.0 -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\NSIS"
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          makensis /DVERSION=$version /DARCH=${{ matrix.arch }} scripts/windows-installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/bundle/MDstage-windows-${{ matrix.arch }}-setup.exe artifacts/MDstage-windows-${{ matrix.arch }}.exe
          Get-ChildItem artifacts/
        shell: pwsh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-${{ matrix.arch }}
          path: artifacts/
          retention-days: 14

  # ── macOS (Apple Silicon and Intel) ───────────────────────────────────────
  # Both on the Apple Silicon runner: the Intel app is cross-compiled there.
  macos:
    if: github.ref_type == 'tag' || github.ref_name == 'native-rewrite' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, option: "" }
          - { arch: x64, option: "--x64" }
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: rustup toolchain install stable --profile minimal
      - run: scripts/bundle-macos.sh --dmg ${{ matrix.option }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-${{ matrix.arch }}
          path: target/bundle/MDstage-macos-${{ matrix.arch }}.dmg
          retention-days: 14

  # ── GitHub Pages (main only) ──────────────────────────────────────────────
  deploy-pages:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # The website is plain files; nothing is built.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        id: deployment

  # ── GitHub Release (tags only) ────────────────────────────────────────────
  release:
    needs: [test, audit, versions, linux, windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets/
          merge-multiple: true
      - run: |
          ls -lh release-assets/
          # A tag like 2.0.0-beta.1 is a pre-release: the website's download links
          # (releases/latest) go on pointing at the last full release.
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes $prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
