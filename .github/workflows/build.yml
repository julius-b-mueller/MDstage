name: Build & Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx webpack --mode production
      - run: node scripts/build-version.js
      - run: npx electron-builder --linux AppImage deb rpm --publish never
      - run: |
          mkdir -p artifacts
          find release -name "*.AppImage" -exec cp {} artifacts/MainDesk-linux-x64.AppImage \; 2>/dev/null || true
          find release -name "*.deb"      -exec cp {} artifacts/MainDesk-linux-x64.deb \;      2>/dev/null || true
          find release -name "*.rpm"      -exec cp {} artifacts/MainDesk-linux-x64.rpm \;      2>/dev/null || true
          ls -lh artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/
          retention-days: 14

  # ── Windows ───────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx webpack --mode production
      - run: node scripts/build-version.js
      - run: npx electron-builder --win nsis --publish never
      - run: |
          mkdir -p artifacts
          Get-ChildItem -Recurse release -Filter "*.exe" | Copy-Item -Destination artifacts/MainDesk-windows-x64.exe
          Get-ChildItem artifacts/
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/
          retention-days: 14

  # ── macOS ─────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx webpack --mode production
      - run: node scripts/build-version.js
      - run: npx electron-builder --mac dmg --publish never
      - run: |
          mkdir -p artifacts
          find release -name "*arm64.dmg" -exec cp {} artifacts/MainDesk-macos-arm64.dmg \; 2>/dev/null || true
          find release -name "*x64.dmg"   -exec cp {} artifacts/MainDesk-macos-x64.dmg \;   2>/dev/null || true
          ls -lh artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/
          retention-days: 14

  # ── Web-Bundle (für Browser-Vorschau) ─────────────────────────────────────
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx webpack --mode production
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist/
          retention-days: 14

  # ── GitHub Pages ──────────────────────────────────────────────────────────
  deploy-pages:
    needs: [build-linux, build-windows, build-macos, build-web]
    if: ${{ always() && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' && needs.build-web.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: artifacts/
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: dist/
      - run: |
          cp -r website public
          mkdir -p public/downloads
          find artifacts -type f | xargs -I{} cp {} public/downloads/ 2>/dev/null || true
          cp -r dist public/app
          echo "Downloads:"
          ls -lh public/downloads/ || echo "(empty)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/
      - uses: actions/deploy-pages@v4
        id: deployment
